<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .clock-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .city-name {
            color: #ffd89b;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .timezone {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .digital-time {
            background: rgba(0, 0, 0, 0.3);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 2.5em;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
        }

        .date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
            margin-top: 10px;
        }

        .day-name {
            color: #ffd89b;
            font-size: 0.9em;
            margin-top: 5px;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .digital-time {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }

        .format-toggle {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }

        .format-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .format-btn.active {
            background: rgba(255, 255, 255, 0.4);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ World Clock</h1>
            <p>Current Time Across Different Time Zones</p>
        </div>

        <div class="format-toggle">
            <button class="format-btn active" onclick="setFormat(24)">24-Hour Format</button>
            <button class="format-btn" onclick="setFormat(12)">12-Hour Format</button>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be generated here by JavaScript -->
        </div>

        <div class="controls">
            <button class="btn" onclick="addClock()">➕ Add Clock</button>
            <button class="btn" onclick="resetClocks()">🔄 Reset</button>
        </div>
    </div>

    <script>
        let timeFormat = 24; // 24-hour or 12-hour format
        let selectedTimezones = [
            { city: 'New York', timezone: 'America/New_York' },
            { city: 'London', timezone: 'Europe/London' },
            { city: 'Tokyo', timezone: 'Asia/Tokyo' },
            { city: 'Sydney', timezone: 'Australia/Sydney' },
            { city: 'Dubai', timezone: 'Asia/Dubai' },
            { city: 'Singapore', timezone: 'Asia/Singapore' }
        ];

        const allTimezones = [
            { city: 'Los Angeles', timezone: 'America/Los_Angeles' },
            { city: 'New York', timezone: 'America/New_York' },
            { city: 'Toronto', timezone: 'America/Toronto' },
            { city: 'Mexico City', timezone: 'America/Mexico_City' },
            { city: 'São Paulo', timezone: 'America/Sao_Paulo' },
            { city: 'London', timezone: 'Europe/London' },
            { city: 'Paris', timezone: 'Europe/Paris' },
            { city: 'Berlin', timezone: 'Europe/Berlin' },
            { city: 'Moscow', timezone: 'Europe/Moscow' },
            { city: 'Dubai', timezone: 'Asia/Dubai' },
            { city: 'Delhi', timezone: 'Asia/Kolkata' },
            { city: 'Bangkok', timezone: 'Asia/Bangkok' },
            { city: 'Singapore', timezone: 'Asia/Singapore' },
            { city: 'Hong Kong', timezone: 'Asia/Hong_Kong' },
            { city: 'Shanghai', timezone: 'Asia/Shanghai' },
            { city: 'Tokyo', timezone: 'Asia/Tokyo' },
            { city: 'Sydney', timezone: 'Australia/Sydney' },
            { city: 'Auckland', timezone: 'Pacific/Auckland' }
        ];

        function setFormat(format) {
            timeFormat = format;
            // Update active button
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function formatTime(date, format) {
            let hours = String(date.getHours()).padStart(2, '0');
            let minutes = String(date.getMinutes()).padStart(2, '0');
            let seconds = String(date.getSeconds()).padStart(2, '0');

            if (format === 12) {
                let ampm = hours >= 12 ? 'PM' : 'AM';
                hours = String(hours % 12 || 12).padStart(2, '0');
                return `${hours}:${minutes}:${seconds} ${ampm}`;
            } else {
                return `${hours}:${minutes}:${seconds}`;
            }
        }

        function getFormattedDate(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            const dayName = days[date.getDay()];
            const monthName = months[date.getMonth()];
            const dateNum = date.getDate();
            const year = date.getFullYear();

            return `${dayName}, ${monthName} ${dateNum}, ${year}`;
        }

        function updateClock(cityElement, timezone, format) {
            try {
                const date = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const parts = formatter.formatToParts(date);
                const dateObj = new Date();
                
                // Get timezone-specific time
                const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
                const tzDate = new Date(date.toLocaleString('en-US', { timeZone: timezone }));
                
                const timeElement = cityElement.querySelector('.digital-time');
                const dateElement = cityElement.querySelector('.date');

                timeElement.textContent = formatTime(tzDate, format);
                dateElement.innerHTML = `
                    <div>${getFormattedDate(tzDate)}</div>
                `;
            } catch (error) {
                console.error(`Error updating timezone ${timezone}:`, error);
            }
        }

        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            selectedTimezones.forEach(item => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <div class="city-name">${item.city}</div>
                    <div class="timezone">${item.timezone}</div>
                    <div class="digital-time">--:--:--</div>
                    <div class="date"></div>
                    <button class="btn" style="width: 100%; margin-top: 15px; font-size: 0.9em;" onclick="removeClock('${item.timezone}')">Remove</button>
                `;
                grid.appendChild(card);
                updateClock(card, item.timezone, timeFormat);
            });
        }

        function removeClock(timezone) {
            selectedTimezones = selectedTimezones.filter(item => item.timezone !== timezone);
            renderClocks();
        }

        function addClock() {
            const availableTimezones = allTimezones.filter(
                tz => !selectedTimezones.find(st => st.timezone === tz.timezone)
            );

            if (availableTimezones.length === 0) {
                alert('All timezones are already added!');
                return;
            }

            const randomTimezone = availableTimezones[Math.floor(Math.random() * availableTimezones.length)];
            selectedTimezones.push(randomTimezone);
            renderClocks();
        }

        function resetClocks() {
            selectedTimezones = [
                { city: 'New York', timezone: 'America/New_York' },
                { city: 'London', timezone: 'Europe/London' },
                { city: 'Tokyo', timezone: 'Asia/Tokyo' },
                { city: 'Sydney', timezone: 'Australia/Sydney' },
                { city: 'Dubai', timezone: 'Asia/Dubai' },
                { city: 'Singapore', timezone: 'Asia/Singapore' }
            ];
            renderClocks();
        }

        // Initialize
        renderClocks();

        // Update clocks every second
        setInterval(() => {
            const cards = document.querySelectorAll('.clock-card');
            cards.forEach((card, index) => {
                updateClock(card, selectedTimezones[index].timezone, timeFormat);
            });
        }, 1000);
    </script>
</body>
</html>
